[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-tumor-monitor"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["torch==2.3.0", "monai==1.3.0", "numpy==1.26.4", "PyYAML==6.0.1", "scikit-learn==1.4.2", "scipy==1.13.0", "pandas==2.2.2", "nibabel==5.2.1"]

[project.scripts]
edge-monitor-train = "edge_tumor_monitor.cli.train:main"
edge-monitor-evaluate = "edge_tumor_monitor.cli.evaluate:main"
edge-monitor-infer = "edge_tumor_monitor.cli.infer:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disable_error_code = ["no-any-return", "no-untyped-call"]
